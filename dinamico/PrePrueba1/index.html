<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js"></script>
</head>
<body>
    <h2>Simulador de fiestas</h2>
    <br>
    <label for="">Cantidad de invitados</label>
    <input type="number" name="" id="cant_invitados">
    <br>
    <label for="">Salon</label>
    <select name="" id="size_salon">
        <option value="500000">Chico</option>
        <option value="700000">Mediano</option>
        <option value="1000000">Grande</option>
    </select>
    <br>
    <label for="">Desea un evento musical?</label>
    <input type="checkbox" name="" id="evento_musical">
    <br>
    <label for="">Nombre del que reserva</label>
    <input type="text" name="" id="nombre">
    <input type="submit" value="Calcular">

    <div id="resultados"></div>

</body>
</html>
