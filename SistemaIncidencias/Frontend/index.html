<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Municipio Incidencias - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">🏙️ Municipio</div>
      <p class="auth-subtitle">Reportes Ciudadanos de Incidencias Urbanas</p>

      <!-- Mensaje de Alerta / Error -->
      <div id="alert-box" style="display: none; padding: 10px; margin-bottom: 16px; border-radius: 6px; font-size: 0.85rem; text-align: center;"></div>

      <!-- Formulario de Login -->
      <form id="login-form">
        <div class="form-group">
          <input type="email" id="login-email" class="form-input" placeholder="Correo Electrónico" required>
        </div>
        <div class="form-group">
          <input type="password" id="login-password" class="form-input" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn-primary">Iniciar Sesión</button>
      </form>

      <!-- Formulario de Registro (Oculto por defecto) -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <input type="text" id="reg-name" class="form-input" placeholder="Nombre Completo" required>
        </div>
        <div class="form-group">
          <input type="email" id="reg-email" class="form-input" placeholder="Correo Electrónico" required>
        </div>
        <div class="form-group">
          <input type="password" id="reg-password" class="form-input" placeholder="Contraseña (mínimo 6 caracteres)" required>
        </div>
        <div class="form-group">
          <select id="reg-role" class="form-select">
            <option value="Ciudadano">Ciudadano</option>
            <option value="Administrador">Administrador Municipal</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Registrarse</button>
      </form>

      <div class="auth-switch">
        <span id="switch-text">¿No tienes una cuenta? <a id="toggle-auth">Regístrate</a></span>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
